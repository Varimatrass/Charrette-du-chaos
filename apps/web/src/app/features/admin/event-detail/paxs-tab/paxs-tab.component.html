<div class="barre-recherche">
  <form [formGroup]="rechercheForm" (ngSubmit)="rechercher()">
    <mat-form-field appearance="outline">
      <mat-label>Rechercher un pax par nom</mat-label>
      <input matInput formControlName="nom" />
    </mat-form-field>
    <button mat-stroked-button type="submit">Rechercher</button>
    <button mat-button type="button" (click)="rechercheForm.reset(); charger()">Réinitialiser</button>
  </form>
</div>

<table mat-table [dataSource]="paxs()" class="tableau">
  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let pax">{{ pax.nom }}</td>
  </ng-container>

  <ng-container matColumnDef="contact">
    <th mat-header-cell *matHeaderCellDef>Contact</th>
    <td mat-cell *matCellDef="let pax">{{ pax.contactEmail || pax.contactTelephone || "—" }}</td>
  </ng-container>

  <ng-container matColumnDef="lien">
    <th mat-header-cell *matHeaderCellDef>Lien personnel</th>
    <td mat-cell *matCellDef="let pax">
      <button mat-button (click)="basculerLien(pax.id)">
        {{ paxOuvert() === pax.id ? "Masquer" : "Voir le lien" }}
      </button>
      @if (paxOuvert() === pax.id) {
        <div class="lien-detail">
          <code>{{ lienDe(pax) }}</code>
          <button mat-icon-button (click)="copierLien(pax)"><mat-icon>content_copy</mat-icon></button>
        </div>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
  <tr mat-row *matRowDef="let row; columns: colonnes"></tr>
</table>

@if (paxs().length === 0) {
  <p class="vide">Aucun pax pour cet évènement pour l'instant.</p>
}
