<div class="page-wide">
  @if (event(); as e) {
    <h1>{{ e.name }}</h1>
    <p class="subtitle">{{ e.location }} — gare de référence : {{ e.referenceStation }}</p>
  }

  <mat-tab-group>
    <mat-tab label="Paxs">
      <app-paxs-tab [eventId]="eventId"></app-paxs-tab>
    </mat-tab>
    <mat-tab label="Navettes">
      <app-shuttles-tab [eventId]="eventId"></app-shuttles-tab>
    </mat-tab>
    <mat-tab label="Trajets / demandes">
      <app-trips-tab [eventId]="eventId"></app-trips-tab>
    </mat-tab>
  </mat-tab-group>
</div>
