<div class="page">
  @if (edition(); as e) {
    <h1>{{ e.nom }}</h1>
    <p class="sous-titre">{{ e.lieu }} — gare de référence : {{ e.gareReference }}</p>
  }

  <mat-tab-group>
    <mat-tab label="Paxs">
      <app-paxs-tab [editionId]="editionId"></app-paxs-tab>
    </mat-tab>
    <mat-tab label="Navettes">
      <app-navettes-tab [editionId]="editionId"></app-navettes-tab>
    </mat-tab>
    <mat-tab label="Trajets / demandes">
      <app-trajets-tab [editionId]="editionId"></app-trajets-tab>
    </mat-tab>
  </mat-tab-group>
</div>
