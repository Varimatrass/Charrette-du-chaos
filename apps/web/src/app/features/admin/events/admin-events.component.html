<div class="page-wide">
  <div class="header">
    <h1>Évènements</h1>
    <button mat-flat-button color="primary" (click)="toggleForm()">Nouvel évènement</button>
  </div>

  @if (showForm()) {
    <mat-card class="card form-card">
      <form [formGroup]="form" (ngSubmit)="create()" class="stacked-form">
        <mat-form-field appearance="outline">
          <mat-label>Nom</mat-label>
          <input matInput formControlName="name" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Date de début</mat-label>
          <input matInput type="date" formControlName="startDate" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Date de fin</mat-label>
          <input matInput type="date" formControlName="endDate" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Lieu</mat-label>
          <input matInput formControlName="location" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Gare de référence</mat-label>
          <input matInput formControlName="referenceStation" required />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">Créer</button>
      </form>
    </mat-card>
  }

  <mat-nav-list>
    @for (event of events(); track event.id) {
      <a mat-list-item [routerLink]="eventLink(event.id)">
        <span matListItemTitle>{{ event.name }}</span>
        <span matListItemLine>
          {{ event.startDate | date: "d MMM yyyy" }} → {{ event.endDate | date: "d MMM yyyy" }} —
          {{ event.location }}
        </span>
      </a>
    }
  </mat-nav-list>
</div>
