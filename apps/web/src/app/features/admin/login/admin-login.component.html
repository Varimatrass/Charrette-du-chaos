<div class="page-centered">
  <mat-card class="card">
    <h1>Espace organisateur·ice</h1>
    <form [formGroup]="form" (ngSubmit)="submit()" class="stacked-form">
      <mat-form-field appearance="outline">
        <mat-label>Clé d'accès</mat-label>
        <input matInput type="password" formControlName="key" required />
      </mat-form-field>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
        Entrer
      </button>
    </form>
  </mat-card>
</div>
